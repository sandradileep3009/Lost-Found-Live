<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand-in desk — Lost &amp; Found</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="desk">
<div class="desk-wrap">

  <div class="desk-head">
    <h1>Hand-in desk</h1>
    <p>Log an item someone brought in</p>
    <span style="margin-left:auto"><a class="link" href="index.html">Dashboard</a></span>
  </div>

  <div class="field">
    <label>Photo</label>
    <div class="photo-drop">
      <img id="preview" alt="" hidden>
      <button class="photo-btn" id="photo-btn" type="button">Take photo</button>
      <button class="photo-btn" id="photo-clear" type="button" hidden>Remove</button>
    </div>
    <input type="file" id="photo" accept="image/*" capture="environment" hidden>
    <div class="hint" id="photo-hint">Optional. Held on this device until an upload endpoint exists.</div>
  </div>

  <div class="field">
    <label>What is it?</label>
    <div class="chips" id="categories"></div>
    <input type="text" id="category-other" placeholder="Something else" hidden style="margin-top:8px">
  </div>

  <div class="field">
    <label>Colour</label>
    <div class="chips" id="colours"></div>
  </div>

  <div class="field">
    <label for="description">Anything distinctive about it?</label>
    <textarea id="description" placeholder="cracked screen, blue case"></textarea>
    <div class="hint">Whatever the owner would say when describing it.</div>
  </div>

  <div class="field">
    <label for="location">Where was it found?</label>
    <select id="location"></select>
  </div>

  <div class="field">
    <label for="contact">Finder's phone number</label>
    <input type="tel" id="contact" inputmode="numeric" autocomplete="off" placeholder="Optional">
  </div>

  <button class="submit" id="save">Log this item</button>
  <div class="desk-status" id="status"></div>

  <section class="recent">
    <h2>Logged at this desk</h2>
    <div id="recent"><div class="empty">Nothing logged yet.</div></div>
  </section>

</div>

<script src="js/api.js"></script>
<script src="js/handin.js"></script>
</body>
</html>
